<svg xmlns="http://www.w3.org/2000/svg" width="800" height="2460" viewBox="0 0 800 2460" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.2" fill="#000" opacity="0.12"/>
    </pattern>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF3B0"/><stop offset="1" stop-color="#FFB4A2"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12122A"/><stop offset="1" stop-color="#2C2C54"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF9A8B"/><stop offset="1" stop-color="#FF6B6B"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A8E6CF"/><stop offset="1" stop-color="#FFD93D"/></linearGradient>
  </defs>
  <rect width="800" height="2460" fill="#ffffff"/>
  <!-- panel 1 -->
  <g>
    <rect x="10" y="10" width="780" height="590" rx="18" fill="url(#g1)" stroke="#1a1a2e" stroke-width="8"/>
    <rect x="10" y="10" width="780" height="590" rx="18" fill="url(#dots)"/>
    <text x="400" y="290" font-size="160" text-anchor="middle">🍕❓🕵️</text>
    <rect x="50" y="400" width="700" height="150" rx="16" fill="#fff" stroke="#1a1a2e" stroke-width="6"/>
    <text x="400" y="455" font-size="34" font-weight="bold" text-anchor="middle" fill="#1a1a2e">EP.2 — "Who Ate My Leftovers?"</text>
    <text x="400" y="505" font-size="30" text-anchor="middle" fill="#1a1a2e">Alex saves ONE slice of pizza for tomorrow.</text>
    <text x="400" y="545" font-size="30" text-anchor="middle" fill="#1a1a2e">By midnight… it's gone. CRIME SCENE! 😱</text>
  </g>
  <!-- panel 2 -->
  <g>
    <rect x="10" y="620" width="780" height="590" rx="18" fill="url(#g2)" stroke="#1a1a2e" stroke-width="8"/>
    <rect x="10" y="620" width="780" height="590" rx="18" fill="url(#dots)"/>
    <text x="400" y="890" font-size="150" text-anchor="middle">🕯️👻⚖️</text>
    <rect x="50" y="1000" width="700" height="160" rx="16" fill="#fff" stroke="#1a1a2e" stroke-width="6"/>
    <text x="400" y="1055" font-size="30" text-anchor="middle" fill="#1a1a2e">Flashlight interrogation. The suspects line up.</text>
    <text x="400" y="1100" font-size="30" text-anchor="middle" fill="#1a1a2e">Jax: "Wasn't me, dude." Poe: "I wept…"</text>
    <text x="400" y="1145" font-size="30" font-weight="bold" text-anchor="middle" fill="#1a1a2e">Sir Reginald is sweating through his visor. 💦</text>
  </g>
  <!-- panel 3 -->
  <g>
    <rect x="10" y="1230" width="780" height="590" rx="18" fill="url(#g3)" stroke="#1a1a2e" stroke-width="8"/>
    <rect x="10" y="1230" width="780" height="590" rx="18" fill="url(#dots)"/>
    <text x="400" y="1500" font-size="150" text-anchor="middle">🛡️🍕😭</text>
    <rect x="50" y="1610" width="700" height="160" rx="16" fill="#fff" stroke="#1a1a2e" stroke-width="6"/>
    <text x="400" y="1665" font-size="30" text-anchor="middle" fill="#1a1a2e">Case closed: cheese found INSIDE the helmet.</text>
    <text x="400" y="1710" font-size="30" text-anchor="middle" fill="#1a1a2e">"A ghost cannot binge!" he sobs. "Verily… I did."</text>
    <text x="400" y="1755" font-size="30" font-weight="bold" text-anchor="middle" fill="#1a1a2e">Poe is taking notes for his epic. 📜</text>
  </g>
  <!-- panel 4 -->
  <g>
    <rect x="10" y="1840" width="780" height="610" rx="18" fill="url(#g4)" stroke="#1a1a2e" stroke-width="8"/>
    <rect x="10" y="1840" width="780" height="610" rx="18" fill="url(#dots)"/>
    <text x="400" y="2115" font-size="150" text-anchor="middle">🧽👑💛</text>
    <rect x="50" y="2230" width="700" height="170" rx="16" fill="#fff" stroke="#1a1a2e" stroke-width="6"/>
    <text x="400" y="2285" font-size="30" text-anchor="middle" fill="#1a1a2e">Sentence: Sir Reginald does dishes for a month.</text>
    <text x="400" y="2330" font-size="30" text-anchor="middle" fill="#1a1a2e">He polishes every plate like Excalibur.</text>
    <text x="400" y="2375" font-size="30" font-weight="bold" text-anchor="middle" fill="#1a1a2e">TO BE CONTINUED… 🍽️</text>
  </g>
</svg>
